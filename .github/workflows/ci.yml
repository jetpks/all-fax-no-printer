name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HANAMI_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/space_server_test
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: test-secret-change-in-production-must-be-at-least-64-chars-min-padding-ok
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-ruby-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-ruby-
      - uses: actions/cache@v6
        with:
          path: /tmp/pgdg-debs
          key: pgdg-debs-postgresql-client-17.10
      # config/db/structure.sql is a PostgreSQL 17 dump (uses transaction_timeout);
      # ubuntu-latest bundles psql 16, which can neither load it nor run the
      # pg_database existence check against a v17 server. Install psql 17 directly
      # from the PGDG pool (skips apt-get update — 3 debs, ~3s vs ~17s).
      # Cached so we don't re-download from apt.postgresql.org every run.
      - name: Install PostgreSQL 17 client
        run: |
          if [ ! -d /tmp/pgdg-debs ]; then
            mkdir -p /tmp/pgdg-debs
            base="https://apt.postgresql.org/pub/repos/apt/pool/main"
            curl -fsSL "$base/p/postgresql-common/postgresql-client-common_291.pgdg24.04+1_all.deb" -o /tmp/pgdg-debs/pcc.deb
            curl -fsSL "$base/p/postgresql-18/libpq5_18.4-1.pgdg24.04+1_amd64.deb" -o /tmp/pgdg-debs/libpq5.deb
            curl -fsSL "$base/p/postgresql-17/postgresql-client-17_17.10-1.pgdg24.04+1_amd64.deb" -o /tmp/pgdg-debs/pc17.deb
          fi
          sudo dpkg -i /tmp/pgdg-debs/pcc.deb /tmp/pgdg-debs/libpq5.deb /tmp/pgdg-debs/pc17.deb
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: bundle install
      - run: bundle exec hanami db prepare
      - run: bundle exec rake test 2>&1 | tee /tmp/rake-test.log
      - if: always()
        name: Summary
        run: |
          echo "## Ruby tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\d+ runs,' /tmp/rake-test.log >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run check

  gem-suites:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    strategy:
      matrix:
        gem:
          - hanami-credentials
          - hanami-force-ssl
          - hanami-healthcheck
          - inertia-hanami
          - vite-hanami
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: gems/${{ matrix.gem }}/vendor/bundle
          key: bundle-gem-${{ matrix.gem }}-${{ hashFiles(format('gems/{0}/Gemfile.lock', matrix.gem)) }}
          restore-keys: bundle-gem-${{ matrix.gem }}-
      - run: bundle install
        working-directory: gems/${{ matrix.gem }}
      - run: bundle exec rake test 2>&1 | tee /tmp/rake-test.log
        working-directory: gems/${{ matrix.gem }}
      - if: always()
        name: Summary
        run: |
          echo "## Gem suite: ${{ matrix.gem }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\d+ runs,' /tmp/rake-test.log >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  security-audit:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-ruby-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-ruby-
      - run: bundle install
      - run: gem install bundler-audit
      - run: bundler-audit check --update 2>&1 | tee /tmp/audit.log
      - if: always()
        name: Summary
        run: |
          echo "## Security audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/audit.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # CD image: on green main, build the multi-arch container and push it to
  # GHCR as :main (mutable — sombrero's ansible-pull polls it every 15m,
  # diffs the ImageID, runs `hanami db prepare` on the new image, then
  # recreates the app container). :sha-<sha> tags are immutable pins for
  # rollback/debugging. The repo is public, so sombrero pulls anonymously —
  # no registry credentials to manage on the host.
  image:
    needs: [ruby-tests, frontend, gem-suites, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jetpks/all-fax-no-printer:main
            ghcr.io/jetpks/all-fax-no-printer:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
